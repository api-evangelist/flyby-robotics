aid: flyby-robotics
name: Flyby Robotics
description: >-
  Flyby Robotics is an American manufacturer of open-architecture, NDAA-compliant
  medium-lift drones built as a platform for physical and edge AI. Its F-11 series
  (F-11T, F-11S, F-11H) pairs onboard NVIDIA Jetson Orin NX GPU compute (up to 314
  TOPS) and an open ArduPilot/CubePilot flight controller with a developer-facing
  C++ SDK, so engineers can register custom payloads, stream video over GStreamer,
  and programmatically control the aircraft. The company ships the Flyby SDK
  (flyby-sdk-release) through GitHub and documents it at docs.flybydev.com, targeting
  ISR, photogrammetry, public-safety, research, and drone-delivery use cases. Flyby
  Robotics raised a $4M pre-seed backed by investors including MaC Venture Capital,
  Gaingels, and Anthemis Group. This profile captures Flyby's developer surface as it
  exists today: an on-board SDK and docs rather than a hosted REST API.
